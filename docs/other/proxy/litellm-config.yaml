# LiteLLM ゲートウェイ設定
# GB10-A (qwen3-coder-next) と GB10-B (gpt-oss-120b) をモデル名で振り分ける
# 手順書: gb10-dual-llm-setup.md
# 起動: litellm --config litellm-config.yaml --host 0.0.0.0 --port 11434
#
# ポート: 外部向け（クライアント → LiteLLM）は 11434。vLLM は 8000 で待ち受ける。
#   GB10-A の vLLM は 127.0.0.1:8000（ループバックのみ）
#   GB10-B の vLLM はコンテナ内 8000 → ホスト 11434 に転送（GB10-A からのみ許可）

model_list:
  # 実装・コーディング用（GB10-A）
  - model_name: qwen3-coder-next
    litellm_params:
      model: hosted_vllm/qwen3-coder-next    # vLLM の --served-model-name と一致させる
      api_base: http://127.0.0.1:8000/v1     # LiteLLM と同じ GB10-A 上（vLLM はループバック公開）
                                             # LiteLLM を Docker で動かす場合は --network host で起動する
      api_key: dummy
      timeout: 600

  # 設計・レビュー用（GB10-B）
  - model_name: gpt-oss-120b
    litellm_params:
      model: hosted_vllm/gpt-oss-120b
      api_base: http://192.168.10.12:11434/v1  # ← GB10-B の IP に変更（ポートはホスト側の 11434）
      api_key: dummy
      timeout: 600

litellm_settings:
  drop_params: true        # vLLM が受け付けない Anthropic 固有パラメータを捨てる
  request_timeout: 600

general_settings:
  master_key: sk-local-change-me   # Claude Code の ANTHROPIC_AUTH_TOKEN と同じ値にする
