# LiteLLM ゲートウェイ設定（SGLang 版）
# GB10-A (qwen3-coder-next) と GB10-B (gpt-oss-120b) をモデル名で振り分ける
# 手順書: gb10-dual-sglang-setup.md
# 起動: litellm --config litellm-config-sglang.yaml --host 0.0.0.0 --port 11434
#
# SGLang は Anthropic 互換の /v1/messages を標準で持つため、provider は anthropic/ にして
# Claude Code のリクエストを OpenAI 形式へ変換せずにそのまま SGLang へ渡す。
# LiteLLM は api_base の末尾に /v1/messages を付けるので、api_base に /v1 は付けない。
#
# ポート: 外部向け（クライアント → LiteLLM）は 11434。SGLang は 8000 で待ち受ける。
#   GB10-A の SGLang は 127.0.0.1:8000（ループバックのみ）
#   GB10-B の SGLang はコンテナ内 8000 → ホスト 11434 に転送（GB10-A からのみ許可）

# Claude Code が送るモデル名（model_name）は Claude の Opus 名にそろえる。
#   claude-sonnet-* は使わない（Sonnet 名では Claude Code の自動承認モードが使えないため）。
#   claude-opus-4-6 = Qwen3-Coder-Next（1台構成・アプリの LLM_MODEL と同じ名前）
#   claude-opus-4-7 = gpt-oss-120b（バージョン番号を変えて区別する）

model_list:
  # 実装・コーディング用（GB10-A）
  - model_name: claude-opus-4-6          # Qwen3-Coder-Next
    litellm_params:
      model: anthropic/qwen3-coder-next      # SGLang の --served-model-name と一致させる
      api_base: http://127.0.0.1:8000        # LiteLLM と同じ GB10-A 上（/v1 は付けない）
      api_key: dummy                         # SGLang を --api-key なしで起動する前提
      timeout: 600

  # 設計・レビュー用（GB10-B）
  - model_name: claude-opus-4-7          # gpt-oss-120b
    litellm_params:
      model: anthropic/gpt-oss-120b
      api_base: http://192.168.10.12:11434   # ← GB10-B の IP に変更（ポートはホスト側の 11434）
      api_key: dummy
      timeout: 600

litellm_settings:
  drop_params: true        # 受け付けられないパラメータは捨てる
  request_timeout: 600

general_settings:
  master_key: sk-local-change-me   # Claude Code の ANTHROPIC_AUTH_TOKEN と同じ値にする
